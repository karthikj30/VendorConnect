<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Registration - VendorConnect</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .register-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 1rem;
            text-align: center;
        }

        .register-form h2 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            text-align: center;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        /* Input with icon (eye) */
        .input-with-icon {
            position: relative;
        }

        .input-with-icon input {
            padding-right: 42px; /* space for the icon */
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.04);
            border: none;
            cursor: pointer;
            color: #667eea;
            padding: 6px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1; /* visible by default */
            transition: transform 120ms ease, opacity 120ms ease;
            pointer-events: auto;
            border-radius: 6px;
        }

        /* hover / active / focus visual feedback */
        .toggle-password:hover,
        .toggle-password:active,
        .toggle-password:focus,
        .toggle-password.visible {
            opacity: 1;
            transform: translateY(-50%) scale(1.03);
        }

        .toggle-password:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.18);
        }

        .dark-mode .toggle-password {
            color: #ffd700;
            opacity: 1;
            background: rgba(255,215,0,0.06);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .login-link {
            margin-top: 1.5rem;
            color: #666;
            text-align: center;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .password-requirements {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .requirement {
            margin: 0.2rem 0;
        }

        .requirement.met {
            color: #28a745;
        }

        .requirement.unmet {
            color: #dc3545;
        }

        /* Dark Mode Overrides */
        body.dark-mode {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            color: #f1f1f1;
        }
        .dark-mode .register-container {
            background: #232526;
            color: #ffd700;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .dark-mode .logo {
            color: #ffd700;
        }
        .dark-mode .register-form h2 {
            color: #ffd700;
        }
        .dark-mode .form-group label {
            color: #ffd700;
        }
        .dark-mode .form-group input,
        .dark-mode .form-group select {
            background: #18191a;
            color: #ffd700;
            border: 2px solid #ffd700;
        }
        .dark-mode .form-group input:focus,
        .dark-mode .form-group select:focus {
            border-color: #ffe066;
        }
        .dark-mode .btn {
            background: #ffd700;
            color: #232526;
            border: 1px solid #ffd700;
        }
        .dark-mode .btn:hover {
            background: #ffe066;
            color: #232526;
        }
        .dark-mode .login-link {
            color: #ffd700;
        }
        .dark-mode .login-link a {
            color: #ffd700;
        }
        .dark-mode .alert-success,
        .dark-mode .alert-error {
            background: #232526;
            color: #ffd700;
            border: 1px solid #ffd700;
        }
        .dark-mode .password-requirements {
            color: #ffd700;
        }
        .dark-mode .requirement.met {
            color: #28a745;
        }
        .dark-mode .requirement.unmet {
            color: #dc3545;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .register-container {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>
    <button id="darkModeToggle" title="Toggle dark mode" style="position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer;"><i class="fas fa-moon"></i></button>

    <div class="register-container">
        <div class="logo">
            <i class="fas fa-utensils"></i> VendorConnect
        </div>
        
        <form class="register-form" id="registerForm">
            <h2>User Registration</h2>
            
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>
            
            <div class="form-row">
                <div class="form-group full-width">
                    <label for="role">Register As</label>
                    <select id="role" name="role" required>
                        <option value="Vendor">Vendor</option>
                        <option value="Supplier">Supplier</option>
                        <option value="Delivery Agent">Delivery Agent</option>
                        <option value="Customer">Customer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>
            
            <div class="form-group">
                <label for="location">Location/Area</label>
                <input type="text" id="location" name="location" required placeholder="Enter your location (e.g., Bandra West, Mumbai)">
            </div>
            
            <div class="form-group">
                <label for="business_type">Business Type</label>
                <select id="business_type" name="business_type" required>
                    <option value="">Select your business type</option>
                    <option value="chaat">Chaat Stall</option>
                    <option value="dosa">Dosa Stall</option>
                    <option value="samosa">Samosa Stall</option>
                    <option value="vada_pav">Vada Pav Stall</option>
                    <option value="tea">Tea Stall</option>
                    <option value="juice">Juice Stall</option>
                    <option value="ice_cream">Ice Cream Stall</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group full-width" id="other_business_group" style="display: none;">
                <label for="other_business">Please specify your stall</label>
                <input type="text" id="other_business" name="other_business" placeholder="e.g., Pav Bhaji Stall">
            </div> 
            
            <div class="form-group" id="vehicle_info_group" style="display:none;">
                <label for="vehicle_info">Vehicle Info (for Delivery Agents)</label>
                <input type="text" id="vehicle_info" name="vehicle_info" placeholder="e.g., Bike - KA01AB1234">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <input type="password" id="password" name="password" required placeholder="Create a strong password" aria-describedby="passwordRequirements">
                    <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility" aria-pressed="false"><i class="fas fa-eye"></i></button>
                </div>
                <div class="password-requirements" id="passwordRequirements">
                    <div class="requirement unmet" id="length">At least 8 characters</div>
                    <div class="requirement unmet" id="uppercase">At least 1 uppercase letter</div>
                    <div class="requirement unmet" id="lowercase">At least 1 lowercase letter</div>
                    <div class="requirement unmet" id="number">At least 1 number</div>
                </div>
            </div> 
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-with-icon">
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password">
                    <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Toggle password visibility" aria-pressed="false"><i class="fas fa-eye"></i></button>
                </div>
            </div> 
            
            <button type="submit" class="btn" id="registerBtn">
                <span id="registerText">Create Account</span>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </button>
            <div style="text-align:center;margin:1rem 0;color:#888;font-weight:600;">OR</div>
            <div id="gSignInWrapper" style="text-align:center;margin-bottom:1rem;">
                <div id="googleSignInButton"></div>
            </div>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="/vendor/login">Login here</a>
        </div>
    </div>

    <script>
        // Password validation
        function validatePassword(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /\d/.test(password)
            };
            
            // Update requirement indicators
            Object.keys(requirements).forEach(req => {
                const element = document.getElementById(req);
                if (requirements[req]) {
                    element.classList.remove('unmet');
                    element.classList.add('met');
                } else {
                    element.classList.remove('met');
                    element.classList.add('unmet');
                }
            });
            
            return Object.values(requirements).every(Boolean);
        }

        // Password confirmation validation
        function validatePasswordConfirmation() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (confirmPassword && password !== confirmPassword) {
                document.getElementById('confirm_password').style.borderColor = '#dc3545';
                return false;
            } else {
                document.getElementById('confirm_password').style.borderColor = '#e1e5e9';
                return true;
            }
        }

        // Event listeners
        document.getElementById('password').addEventListener('input', function(e) {
            validatePassword(e.target.value);
        });

        document.getElementById('confirm_password').addEventListener('input', function(e) {
            validatePasswordConfirmation();
        });

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const location = document.getElementById('location').value;
            const role = document.getElementById('role').value;
            const businessType = document.getElementById('business_type').value;
            const otherBusiness = document.getElementById('other_business') ? document.getElementById('other_business').value.trim() : '';
            const vehicleInfo = document.getElementById('vehicle_info') ? document.getElementById('vehicle_info').value.trim() : '';
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            // Validation
            if (!validatePassword(password)) {
                document.getElementById('errorAlert').textContent = 'Please meet all password requirements.';
                document.getElementById('errorAlert').style.display = 'block';
                return;
            }
            
            if (!validatePasswordConfirmation()) {
                document.getElementById('errorAlert').textContent = 'Passwords do not match.';
                document.getElementById('errorAlert').style.display = 'block';
                return;
            }

            if (role === 'Vendor' && businessType === 'other' && !otherBusiness) {
                document.getElementById('errorAlert').textContent = 'Please specify your stall type.';
                document.getElementById('errorAlert').style.display = 'block';
                return;
            }
            
            // Show loading
            document.getElementById('registerText').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('registerBtn').disabled = true;
            
            // Hide previous alerts
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
            
            try {
                const response = await fetch('/vendor/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                            role: role,
                            name: name,
                            phone: phone,
                            email: email,
                            location: location,
                            business_type: businessType,
                            other_business: businessType === 'other' ? otherBusiness : '',
                            vehicle_info: vehicleInfo,
                            password: password
                        })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('successAlert').textContent = data.message;
                    document.getElementById('successAlert').style.display = 'block';
                    
                    // Redirect to login after a short delay
                    setTimeout(() => {
                        window.location.href = '/vendor/login';
                    }, 2000);
                } else {
                    document.getElementById('errorAlert').textContent = data.message;
                    document.getElementById('errorAlert').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('errorAlert').textContent = 'An error occurred. Please try again.';
                document.getElementById('errorAlert').style.display = 'block';
            } finally {
                // Hide loading
                document.getElementById('registerText').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                document.getElementById('registerBtn').disabled = false;
            }
        });

        // Toggle password visibility only while the icon is pressed (press-and-hold)
        document.querySelectorAll('.toggle-password').forEach(btn => {
            const targetId = btn.getAttribute('data-target');
            const input = document.getElementById(targetId);
            if (!input) return;

            const show = () => {
                input.type = 'text';
                btn.classList.add('visible');
                btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
                btn.setAttribute('aria-pressed', 'true');
            };

            const hide = () => {
                input.type = 'password';
                btn.classList.remove('visible');
                btn.innerHTML = '<i class="fas fa-eye"></i>';
                btn.setAttribute('aria-pressed', 'false');
            };

            // Pointer events (mouse and stylus)
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // keep focus on input
                show();
            });
            btn.addEventListener('pointerup', hide);
            btn.addEventListener('pointercancel', hide);
            btn.addEventListener('pointerleave', hide);

            // Touch events (some older browsers)
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); show(); }, { passive: false });
            btn.addEventListener('touchend', hide);
            btn.addEventListener('touchcancel', hide);

            // Keyboard accessibility: hold Space or Enter to show while pressed
            btn.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    show();
                }
            });
            btn.addEventListener('keyup', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    hide();
                }
            });

            // Hide on blur or any focus change
            btn.addEventListener('blur', hide);

            // Ensure it's hidden by default
            hide();
        });

        // Phone number formatting
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 10) {
                value = value.slice(0, 10);
            }
            e.target.value = value;
        });

        // Show 'Other' stall input when Business Type = other
        const businessSelect = document.getElementById('business_type');
        const otherGroup = document.getElementById('other_business_group');
        const otherInput = document.getElementById('other_business');
        const roleSelect = document.getElementById('role');
        const vehicleGroup = document.getElementById('vehicle_info_group');

        // Show/hide vehicle info when Delivery Agent selected
        function updateRoleUI() {
            const r = roleSelect.value;
            if (r === 'Delivery Agent') {
                vehicleGroup.style.display = 'block';
            } else {
                vehicleGroup.style.display = 'none';
            }

            // business type only required for Vendors
            if (r === 'Vendor') {
                businessSelect.setAttribute('required', 'required');
            } else {
                businessSelect.removeAttribute('required');
            }
        }

        roleSelect.addEventListener('change', updateRoleUI);
        updateRoleUI();

        if (businessSelect) {
            businessSelect.addEventListener('change', function() {
                if (this.value === 'other') {
                    otherGroup.style.display = 'block';
                    if (otherInput) {
                        otherInput.setAttribute('required', 'required');
                        otherInput.focus();
                    }
                } else {
                    otherGroup.style.display = 'none';
                    if (otherInput) {
                        otherInput.removeAttribute('required');
                    }
                }
            });

            // Initialize on load in case of persisted value
            if (businessSelect.value === 'other') {
                otherGroup.style.display = 'block';
                if (otherInput) otherInput.setAttribute('required', 'required');
            }
        }
    </script>
    <script>
        // Server-side Google OAuth button: redirect to start route
        document.addEventListener('DOMContentLoaded', function() {
            const wrapper = document.getElementById('gSignInWrapper');
            if (!wrapper) return;
            const btn = document.createElement('a');
            btn.href = '/vendor/login/google';
            btn.className = 'btn';
            btn.style.background = '#DB4437';
            btn.style.borderColor = '#DB4437';
            btn.style.display = 'inline-block';
            btn.style.width = '300px';
            btn.style.color = '#fff';
            btn.style.textDecoration = 'none';
            btn.style.textAlign = 'center';
            btn.style.padding = '10px 0';
            btn.style.borderRadius = '8px';
            btn.innerHTML = '<i class="fab fa-google" style="margin-right:8px"></i> Sign in with Google';
            wrapper.innerHTML = '';
            wrapper.appendChild(btn);
        });
    </script>
    <script>
// Dark mode toggle logic
const darkModeToggle = document.getElementById('darkModeToggle');
function setDarkMode(enabled) {
    if (enabled) {
        document.body.classList.add('dark-mode');
        localStorage.setItem('darkMode', 'enabled');
        darkModeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    } else {
        document.body.classList.remove('dark-mode');
        localStorage.setItem('darkMode', 'disabled');
        darkModeToggle.innerHTML = '<i class="fas fa-moon"></i>';
    }
}
darkModeToggle.addEventListener('click', () => {
    setDarkMode(!document.body.classList.contains('dark-mode'));
});
// On load
if (localStorage.getItem('darkMode') === 'enabled' || (localStorage.getItem('darkMode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    setDarkMode(true);
} else {
    setDarkMode(false);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Login - VendorConnect</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .login-form h2 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Input with icon (eye) */
        .input-with-icon {
            position: relative;
        }

        .input-with-icon input {
            padding-right: 42px; /* space for the icon */
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.04);
            border: none;
            cursor: pointer;
            color: #667eea;
            padding: 6px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1; /* visible by default */
            transition: transform 120ms ease, opacity 120ms ease;
            pointer-events: auto;
            border-radius: 6px;
        }

        .toggle-password:hover,
        .toggle-password:active,
        .toggle-password:focus,
        .toggle-password.visible {
            opacity: 1;
            transform: translateY(-50%) scale(1.03);
        }

        .toggle-password:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.18);
        }

        .dark-mode .toggle-password {
            color: #ffd700;
            opacity: 1;
            background: rgba(255,215,0,0.06);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .register-link {
            margin-top: 1.5rem;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Dark Mode Overrides */
        body.dark-mode {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            color: #f1f1f1;
        }
        .dark-mode .login-container {
            background: #232526;
            color: #ffd700;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .dark-mode .logo {
            color: #ffd700;
        }
        .dark-mode .login-form h2 {
            color: #ffd700;
        }
        .dark-mode .form-group label {
            color: #ffd700;
        }
        .dark-mode .form-group input,
        .dark-mode .form-group select {
            background: #18191a;
            color: #ffd700;
            border: 2px solid #ffd700;
        }
        .dark-mode .form-group input:focus,
        .dark-mode .form-group select:focus {
            border-color: #ffe066;
        }
        .dark-mode .btn {
            background: #ffd700;
            color: #232526;
            border: 1px solid #ffd700;
        }
        .dark-mode .btn:hover {
            background: #ffe066;
            color: #232526;
        }
        .dark-mode .register-link {
            color: #ffd700;
        }
        .dark-mode .register-link a {
            color: #ffd700;
        }
        .dark-mode .alert-success,
        .dark-mode .alert-error {
            background: #232526;
            color: #ffd700;
            border: 1px solid #ffd700;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 {
            margin: 0;
            color: #333;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        .dark-mode .modal-content {
            background-color: #232526;
            color: #ffd700;
        }

        .dark-mode .modal-header h3 {
            color: #ffd700;
        }

        .dark-mode .close {
            color: #ffd700;
        }

        .dark-mode .close:hover {
            color: #ffe066;
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>
    <button id="darkModeToggle" title="Toggle dark mode" style="position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer;"><i class="fas fa-moon"></i></button>

    <div class="login-container">
        <div class="logo">
            <i class="fas fa-utensils"></i> VendorConnect
        </div>
        
        <form class="login-form" id="loginForm">
            <h2>Login</h2>
            
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>
            
            <div class="form-group">
                <label for="role">Login As</label>
                <select id="role" name="role" required>
                    <option value="Vendor">Vendor</option>
                    <option value="Supplier">Supplier</option>
                    <option value="Delivery Agent">Delivery Agent</option>
                    <option value="Customer">Customer</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                    <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility" aria-pressed="false"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            
            <div class="form-group" style="text-align: right; margin-bottom: 1rem;">
                <a href="#" id="forgotPasswordLink" style="color: #667eea; text-decoration: none; font-size: 0.9rem;">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn" id="loginBtn">
                <span id="loginText">Login</span>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="/vendor/register">Register here</a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Reset Password</h3>
                <span class="close" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="alert alert-error" id="modalErrorAlert"></div>
                <div class="alert alert-success" id="modalSuccessAlert"></div>
                
                <div id="emailStep">
                    <div class="form-group">
                        <label for="resetEmail">Email or Phone</label>
                        <input type="text" id="resetEmail" placeholder="Enter your email or phone">
                    </div>
                    <button type="button" class="btn" id="sendOtpBtn">Send OTP</button>
                </div>
                
                <div id="otpStep" style="display: none;">
                    <div class="form-group">
                        <label for="otpCode">Enter OTP</label>
                        <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" maxlength="6">
                    </div>
                    <button type="button" class="btn" id="verifyOtpBtn">Verify OTP</button>
                </div>
                
                <div id="passwordStep" style="display: none;">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password">
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" placeholder="Confirm new password">
                    </div>
                    <button type="button" class="btn" id="resetPasswordBtn">Reset Password</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const role = document.getElementById('role').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            // Show loading
            document.getElementById('loginText').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loginBtn').disabled = true;
            
            // Hide previous alerts
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
            
            try {
                const response = await fetch('/vendor/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        role: role,
                        phone: phone,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('successAlert').textContent = data.message;
                    document.getElementById('successAlert').style.display = 'block';
                    // Redirect to dashboard after a short delay. Use server-provided redirect if available.
                    const redirectTo = data.redirect || '/vendor/dashboard';
                    setTimeout(() => {
                        window.location.href = redirectTo;
                    }, 800);
                } else {
                    document.getElementById('errorAlert').textContent = data.message;
                    document.getElementById('errorAlert').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('errorAlert').textContent = 'An error occurred. Please try again.';
                document.getElementById('errorAlert').style.display = 'block';
            } finally {
                // Hide loading
                document.getElementById('loginText').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // Toggle password visibility only while the icon is pressed (press-and-hold)
        document.querySelectorAll('.toggle-password').forEach(btn => {
            const targetId = btn.getAttribute('data-target');
            const input = document.getElementById(targetId);
            if (!input) return;

            const show = () => {
                input.type = 'text';
                btn.classList.add('visible');
                btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
                btn.setAttribute('aria-pressed', 'true');
            };

            const hide = () => {
                input.type = 'password';
                btn.classList.remove('visible');
                btn.innerHTML = '<i class="fas fa-eye"></i>';
                btn.setAttribute('aria-pressed', 'false');
            };

            // Pointer events (mouse and stylus)
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // keep focus on input
                show();
            });
            btn.addEventListener('pointerup', hide);
            btn.addEventListener('pointercancel', hide);
            btn.addEventListener('pointerleave', hide);

            // Touch events (some older browsers)
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); show(); }, { passive: false });
            btn.addEventListener('touchend', hide);
            btn.addEventListener('touchcancel', hide);

            // Keyboard accessibility: hold Space or Enter to show while pressed
            btn.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    show();
                }
            });
            btn.addEventListener('keyup', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    hide();
                }
            });

            // Hide on blur or any focus change
            btn.addEventListener('blur', hide);

            // Ensure it's hidden state is set
            hide();
        });

        // Phone number formatting
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 10) {
                value = value.slice(0, 10);
            }
            e.target.value = value;
        });

        // Forgot Password Modal functionality
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const forgotPasswordModal = document.getElementById('forgotPasswordModal');
        const closeModal = document.getElementById('closeModal');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const resetPasswordBtn = document.getElementById('resetPasswordBtn');
        const emailStep = document.getElementById('emailStep');
        const otpStep = document.getElementById('otpStep');
        const passwordStep = document.getElementById('passwordStep');
        const modalErrorAlert = document.getElementById('modalErrorAlert');
        const modalSuccessAlert = document.getElementById('modalSuccessAlert');

        let currentEmail = '';

        // Open modal
        forgotPasswordLink.addEventListener('click', function(e) {
            e.preventDefault();
            forgotPasswordModal.style.display = 'flex';
            resetModal();
        });

        // Close modal
        closeModal.addEventListener('click', function() {
            forgotPasswordModal.style.display = 'none';
            resetModal();
        });

        // Close modal when clicking outside
        forgotPasswordModal.addEventListener('click', function(e) {
            if (e.target === forgotPasswordModal) {
                forgotPasswordModal.style.display = 'none';
                resetModal();
            }
        });

        // Reset modal to initial state
        function resetModal() {
            emailStep.style.display = 'block';
            otpStep.style.display = 'none';
            passwordStep.style.display = 'none';
            modalErrorAlert.style.display = 'none';
            modalSuccessAlert.style.display = 'none';
            currentEmail = '';
        }

        // Send OTP
        sendOtpBtn.addEventListener('click', async function() {
            const role = document.getElementById('role').value;
            const email = document.getElementById('resetEmail').value;
            
            if (!email) {
                modalErrorAlert.textContent = 'Please enter your email address';
                modalErrorAlert.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/vendor/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ role: role, identifier: email })
                });

                const data = await response.json();

                if (data.success) {
                    currentEmail = email;
                    emailStep.style.display = 'none';
                    otpStep.style.display = 'block';
                    modalSuccessAlert.textContent = data.message;
                    modalSuccessAlert.style.display = 'block';

                    // SMS DLT fallback: auto-fill OTP and show it prominently
                    if (data.otp_fallback) {
                        document.getElementById('otpCode').value = data.otp_fallback;
                        modalSuccessAlert.innerHTML =
                            `⚠️ SMS delivery requires DLT registration.<br>` +
                            `Your OTP (dev mode): <strong style="font-size:1.4rem;letter-spacing:4px">${data.otp_fallback}</strong><br>` +
                            `<small>It has been auto-filled for you.</small>`;
                    }
                } else {
                    modalErrorAlert.textContent = data.message;
                    modalErrorAlert.style.display = 'block';
                }
            } catch (error) {
                modalErrorAlert.textContent = 'An error occurred. Please try again.';
                modalErrorAlert.style.display = 'block';
            }
        });

        // Verify OTP
        verifyOtpBtn.addEventListener('click', async function() {
            const otp = document.getElementById('otpCode').value;

            if (!otp || otp.length !== 6) {
                modalErrorAlert.textContent = 'Please enter a valid 6-digit OTP';
                modalErrorAlert.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/vendor/verify-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        identifier: currentEmail, 
                        otp: otp 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    otpStep.style.display = 'none';
                    passwordStep.style.display = 'block';
                    modalSuccessAlert.textContent = data.message;
                    modalSuccessAlert.style.display = 'block';
                } else {
                    modalErrorAlert.textContent = data.message;
                    modalErrorAlert.style.display = 'block';
                }
            } catch (error) {
                modalErrorAlert.textContent = 'An error occurred. Please try again.';
                modalErrorAlert.style.display = 'block';
            }
        });

        // Reset Password
        resetPasswordBtn.addEventListener('click', async function() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (!newPassword || newPassword.length < 8) {
                modalErrorAlert.textContent = 'Password must be at least 8 characters long';
                modalErrorAlert.style.display = 'block';
                return;
            }

            if (newPassword !== confirmNewPassword) {
                modalErrorAlert.textContent = 'Passwords do not match';
                modalErrorAlert.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/vendor/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        role: document.getElementById('role').value,
                        identifier: currentEmail, 
                        new_password: newPassword 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    modalSuccessAlert.textContent = data.message + '. You can now login with your new password.';
                    modalSuccessAlert.style.display = 'block';
                    
                    // Close modal after 3 seconds
                    setTimeout(() => {
                        forgotPasswordModal.style.display = 'none';
                        resetModal();
                    }, 3000);
                } else {
                    modalErrorAlert.textContent = data.message;
                    modalErrorAlert.style.display = 'block';
                }
            } catch (error) {
                modalErrorAlert.textContent = 'An error occurred. Please try again.';
                modalErrorAlert.style.display = 'block';
            }
        });

        // OTP input formatting
        document.getElementById('otpCode').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 6) {
                value = value.slice(0, 6);
            }
            e.target.value = value;
        });
    </script>
    <script>
// Dark mode toggle logic
const darkModeToggle = document.getElementById('darkModeToggle');
function setDarkMode(enabled) {
    if (enabled) {
        document.body.classList.add('dark-mode');
        localStorage.setItem('darkMode', 'enabled');
        darkModeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    } else {
        document.body.classList.remove('dark-mode');
        localStorage.setItem('darkMode', 'disabled');
        darkModeToggle.innerHTML = '<i class="fas fa-moon"></i>';
    }
}
darkModeToggle.addEventListener('click', () => {
    setDarkMode(!document.body.classList.contains('dark-mode'));
});
// On load
if (localStorage.getItem('darkMode') === 'enabled' || (localStorage.getItem('darkMode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    setDarkMode(true);
} else {
    setDarkMode(false);
}
</script>

<!-- ── AWS Cognito MFA Modal ─────────────────────────────────────────────── -->
<div id="mfaModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:16px;padding:32px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.2)">
    <div style="font-size:48px;margin-bottom:12px">🔐</div>
    <h2 style="color:#333;margin-bottom:8px">Two-Factor Authentication</h2>
    <p style="color:#666;font-size:14px;margin-bottom:24px" id="mfaDesc">Enter the 6-digit code sent to your phone.</p>
    <input id="mfaCodeInput" type="text" maxlength="6" inputmode="numeric" placeholder="123456"
      style="width:100%;padding:14px;font-size:22px;letter-spacing:8px;text-align:center;border:2px solid #e2e8f0;border-radius:10px;outline:none;margin-bottom:16px"
      oninput="this.value=this.value.replace(/\D/g,'').slice(0,6)">
    <button onclick="submitMFACode()" style="width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer">
      ✅ Verify
    </button>
    <p id="mfaError" style="color:#e53e3e;font-size:13px;margin-top:12px;display:none"></p>
    <button onclick="document.getElementById('mfaModal').style.display='none'" style="margin-top:12px;background:none;border:none;color:#888;cursor:pointer;font-size:13px">Cancel</button>
  </div>
</div>

<script>
// ── AWS Cognito MFA support ────────────────────────────────────────────────
let _cognitoMfaSession  = '';
let _cognitoMfaEmail    = '';
let _cognitoMfaChallenge = 'SMS_MFA';

// Intercept normal login form to optionally run Cognito first
// (falls back to standard login if Cognito is not configured)
(function() {
    const form = document.querySelector('form[action*="login"], #loginForm, form');
    if (!form) return;
    form.addEventListener('submit', async function(e) {
        const phoneInput = document.getElementById('phone');
        const passInput  = document.getElementById('password');
        if (!phoneInput || !passInput) return;  // let default submit proceed

        const email    = phoneInput.value.trim();
        const password = passInput.value;

        // Try Cognito first (silently, only if it's an email)
        if (email.includes('@')) {
            try {
                const res = await fetch('/api/auth/cognito/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if (data.challenge) {
                    // MFA required — stop normal submit, show MFA modal
                    e.preventDefault();
                    _cognitoMfaSession   = data.session;
                    _cognitoMfaEmail     = email;
                    _cognitoMfaChallenge = data.challenge;
                    document.getElementById('mfaDesc').textContent =
                        data.challenge === 'SMS_MFA'
                            ? 'Enter the 6-digit code sent to your phone via SMS.'
                            : 'Enter the 6-digit code from your authenticator app.';
                    document.getElementById('mfaModal').style.display = 'flex';
                }
                // If Cognito succeeds or fails (not configured), fall through to normal submit
            } catch(err) {
                // Cognito not reachable — let normal login proceed
            }
        }
    });
})();

async function submitMFACode() {
    const code  = document.getElementById('mfaCodeInput').value.trim();
    const errEl = document.getElementById('mfaError');
    errEl.style.display = 'none';
    if (code.length !== 6) { errEl.textContent = 'Enter a 6-digit code.'; errEl.style.display='block'; return; }
    try {
        const res = await fetch('/api/auth/cognito/mfa', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: _cognitoMfaEmail, mfa_code: code,
                                  session: _cognitoMfaSession, challenge: _cognitoMfaChallenge})
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('mfaModal').style.display = 'none';
            // MFA passed — submit the original form to establish Flask session
            const form = document.querySelector('form');
            if (form) form.submit();
        } else {
            errEl.textContent = data.message || 'Invalid code. Try again.';
            errEl.style.display = 'block';
        }
    } catch(err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = 'block';
    }
}
</script>

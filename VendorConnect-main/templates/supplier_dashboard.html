<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Dashboard - VendorConnect</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#333}
        .container{max-width:1000px;margin:40px auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
        h1{color:#2c3e50}
        .actions{display:flex;gap:12px;margin-top:16px}
        .btn{padding:10px 14px;background:#667eea;color:#fff;border-radius:6px;text-decoration:none}
    </style>
</head>
<body>
    <div class="container">
        <h1>Supplier Dashboard</h1>
        <p>Welcome, supplier. Use the links below to manage your products, view orders and update availability.</p>
        <div class="actions">
            <a class="btn" href="#">Manage Products</a>
            <a class="btn" href="#">View Orders</a>
            <a class="btn" href="#">Update Profile</a>
            <a class="btn" href="/logout">Logout</a>
        </div>
    </div>
</body>
</html>

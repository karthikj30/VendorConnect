<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Live Order Tracking</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin:0; }
        .header { padding:12px 16px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.06); display:flex; align-items:center; gap:12px }
        .title { font-weight:700; color:#222 }
        #map { width:100%; height:70vh }
        .info { padding:12px 16px; background:#f9f9f9 }
        .badge { display:inline-block; padding:6px 10px; background:#e9f5ff; border-radius:8px; color:#0077cc; font-weight:700 }
        .small { font-size:13px; color:#666 }
        .center { text-align:center; padding:40px }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Live Tracking</div>
        <div style="flex:1"></div>
        <div class="small">Token: {{ token }}</div>
    </div>

    {% if invalid %}
    <div class="center">
        <h3>Tracking link expired or invalid</h3>
        <p class="small">This tracking link is no longer valid.</p>
    </div>
    {% else %}

    <div id="map"></div>
    <div class="info">
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="badge" id="orderStatus">Loading...</div>
            <div class="small" id="etaText">ETA: —</div>
            <div style="flex:1"></div>
            <button id="copyLinkBtn">Copy link</button>
        </div>
        <div style="margin-top:8px" class="small">Agent location updates in real-time. Share this link to let others follow the order.</div>
    </div>

    <script>
        const token = '{{ token }}';
        const googleKey = '{{ google_maps_key }}';

        if (!googleKey) {
            document.body.innerHTML = '<div style="padding:40px; text-align:center;"><h3>Map API not configured</h3><p>The Google Maps API key is not set. Please configure it in the environment.</p></div>';
        }

        // Load Google Maps script dynamically
        function loadGoogleMaps(cb) {
            if (!googleKey) { console.error('No Google Maps key'); return; }
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${googleKey}&libraries=geometry,places`;
            s.async = true; s.defer = true;
            s.onload = cb;
            s.onerror = () => { console.error('Failed to load Google Maps'); };
            document.head.appendChild(s);
        }

        let map, agentMarker, customerMarker, routeLine;
        let customerPos = null;

        function initMap(initialLat, initialLng) {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: initialLat, lng: initialLng },
                zoom: 13,
                mapTypeControl: false
            });

            agentMarker = new google.maps.Marker({
                position: { lat: initialLat, lng: initialLng },
                map: map,
                title: 'Delivery Agent',
                icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#2ecc71', fillOpacity:1, strokeColor:'#fff', strokeWeight:2 }
            });

            routeLine = new google.maps.Polyline({ path: [], strokeColor:'#2196F3', strokeWeight:4, map });
        }

        function updateAgent(lat, lng) {
            const pos = { lat: lat, lng: lng };
            if (!agentMarker) {
                initMap(lat, lng);
            } else {
                agentMarker.setPosition(pos);
            }

            if (customerPos) {
                // update route
                routeLine.setPath([ pos, customerPos ]);
                fitBounds(pos, customerPos);
                computeETA(pos, customerPos);
            } else {
                map.panTo(pos);
            }
        }

        function setCustomer(lat, lng) {
            customerPos = { lat, lng };
            if (!customerMarker) {
                customerMarker = new google.maps.Marker({ position: customerPos, map, title: 'Destination', icon: { path: google.maps.SymbolPath.CIRCLE, scale:7, fillColor:'#ff5252', fillOpacity:1, strokeColor:'#fff', strokeWeight:2 } });
            } else {
                customerMarker.setPosition(customerPos);
            }
        }

        function fitBounds(a, b) {
            const bounds = new google.maps.LatLngBounds();
            bounds.extend(a); bounds.extend(b);
            map.fitBounds(bounds, 50);
        }

        function computeETA(origin, dest) {
            try {
                const directionsService = new google.maps.DirectionsService();
                directionsService.route({ origin, destination: dest, travelMode: 'DRIVING' }, (res, status) => {
                    if (status === 'OK' && res.routes && res.routes[0] && res.routes[0].legs && res.routes[0].legs[0]) {
                        const leg = res.routes[0].legs[0];
                        document.getElementById('etaText').textContent = `ETA: ${leg.duration.text} • ${ (leg.distance && leg.distance.text) ? leg.distance.text : '' }`;
                    }
                });
            } catch (e) { console.warn('ETA error', e); }
        }

        async function fetchInfo() {
            try {
                const resp = await fetch(`/api/track/${token}/info`);
                if (!resp.ok) {
                    document.getElementById('orderStatus').textContent = 'Invalid/Expired';
                    return;
                }
                const data = await resp.json();
                if (!data.success) {
                    document.getElementById('orderStatus').textContent = 'Invalid';
                    return;
                }
                const order = data.order;
                document.getElementById('orderStatus').textContent = order.status || 'Unknown';
                if (order.delivery_latitude && order.delivery_longitude) {
                    setCustomer(parseFloat(order.delivery_latitude), parseFloat(order.delivery_longitude));
                }
            } catch (e) {
                console.error('Fetch info error', e);
                document.getElementById('orderStatus').textContent = 'Error';
            }
        }

        function startSSE() {
            const es = new EventSource(`/api/track/${token}/events`);
            es.onmessage = (evt) => {
                try {
                    const ev = JSON.parse(evt.data);
                    if (ev.type === 'agent_location') {
                        const d = ev.data || {};
                        if (d.latitude && d.longitude) updateAgent(d.latitude, d.longitude);
                    }
                    if (ev.type === 'status_update') {
                        const st = ev.data && ev.data.status;
                        if (st) document.getElementById('orderStatus').textContent = st;
                    }
                } catch (e) { console.error('SSE parse', e); }
            };
            es.onerror = (e) => { console.warn('SSE error', e); };
        }

        document.getElementById('copyLinkBtn')?.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => alert('Link copied'));
        });

        // Bootstrap
        (async function(){
            await fetchInfo();
            loadGoogleMaps(() => {
                // If customer position available, init map centered there
                const initLat = (customerPos && customerPos.lat) ? customerPos.lat : 12.9716;
                const initLng = (customerPos && customerPos.lng) ? customerPos.lng : 77.5946;
                initMap(initLat, initLng);
                if (customerPos) setCustomer(customerPos.lat, customerPos.lng);
                startSSE();
            });
        })();
    </script>

    {% endif %}
</body>
</html>
